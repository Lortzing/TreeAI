name: refactor-browser-smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - name: Build Studio internal event-journal dependency
        run: npm run build:deps --workspace @treeai/studio
      - name: Require real headless Chrome/Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "No Chrome/Chromium binary on CI runner" >&2
            exit 1
          fi
      - name: Real Chrome boot, materials, and Beta usability (offline Echo)
        env:
          TREEAI_TEST_CHROME_NO_SANDBOX: "1"
        shell: bash
        run: |
          node scripts/run-d4-browser.mjs --mode selftest \
            --only d4-read-and-select \
            --only d4-beta-usability
      - name: Real Chrome terminology and search navigation (offline Echo)
        env:
          TREEAI_TEST_CHROME_NO_SANDBOX: "1"
        shell: bash
        run: |
          node scripts/run-d4-browser.mjs --mode selftest \
            --only terminology-path \
            --only d4-search-recover
