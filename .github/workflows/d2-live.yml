# TreeAI D2 LIVE scenario suite (Agent F).
#
# NEVER runs on push/PR — manual dispatch only, inside a protected GitHub
# environment ("d2-live") whose credentials are maintained by the repo
# admins. Normal offline PRs never force live model calls; this is the only
# entry point that does.
#
# Secret hygiene:
#   - the three credential VALUES exist only inside the `Run live suite`
#     step's env mapping and are forwarded, in memory, to the runtime
#     factory by scripts/verify-d2-live.js;
#   - nothing echoes them, no artifact upload covers a process env dump,
#     and the verifier itself masks/strips secret-shaped output and fails
#     the run if a credential value ever reaches the evidence;
#   - the user's real Pi config (~/.pi) is never read — there is no
#     fallback path.
#
# Missing credentials are not a workflow failure: verify-d2-live reports
# every scenario BLOCKED and exits 3 (the job is marked failed so the
# dispatch is visible — that is intentional and documented in tests/README).

name: d2-live

on:
  workflow_dispatch:
    inputs:
      driver:
        description: "Runtime driver: pi (real, needs credentials) or fake (offline dry-run)"
        type: choice
        options: [pi, fake]
        default: pi
      d1_repro:
        description: "Also run ./d1-spikes/scripts/verify-d1 --repro (explicit version-regression entry; needs network)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: d2-live
  cancel-in-progress: false

jobs:
  live:
    name: verify:d2:live (${{ inputs.driver }} driver)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: d2-live
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node (pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Offline gate first (live never replaces the offline check)
        run: node scripts/verify-d2.js

      - name: Run live suite
        env:
          TREEAI_LIVE_PROVIDER_ID: ${{ secrets.LIVE_PROVIDER_ID }}
          TREEAI_LIVE_MODEL_ID: ${{ secrets.LIVE_MODEL_ID }}
          TREEAI_LIVE_API_KEY: ${{ secrets.LIVE_API_KEY }}
        run: node scripts/verify-d2-live.js --driver=${{ inputs.driver }}

      - name: D1 version-regression reproduction (explicit opt-in)
        if: ${{ inputs.d1_repro }}
        run: ./d1-spikes/scripts/verify-d1 --repro

      - name: Upload live evidence (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d2-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/d2/
          retention-days: 14
