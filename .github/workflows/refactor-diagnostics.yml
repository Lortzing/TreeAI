name: refactor-diagnostics
on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - name: Repository inventory sanity
        run: |
          node scripts/repo-inventory.mjs --out /tmp/treeai-inventory.json
          node -e 'const r=require("/tmp/treeai-inventory.json"); if(r.files.length<3000) process.exit(1); console.log("Tracked files:",r.files.length,"Review candidates:",r.files.filter(x=>x.review).length)'
      - name: Native ESM/CSS and package inclusion dependency audit
        run: node scripts/audit-studio-assets.mjs
      - name: Browser shared source/view regressions (Node, no browser shim)
        run: node --test apps/studio/tests/shared-utils.test.mjs
      - name: Root test typecheck (diagnostic output)
        run: node node_modules/typescript/bin/tsc -p tests/tsconfig.json --pretty false
      - name: All production typechecks (diagnostic output)
        if: always()
        run: npm run typecheck
      - name: Studio test suite (diagnostic output)
        if: always()
        run: npm test --workspace @treeai/studio
      - name: Install deterministic TrueType CJK test font (Linux B6)
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          test -r /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      - name: D4 offline verifier (report blocked honestly)
        if: always()
        env:
          TREEAI_B6_FONT_PATH: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
        shell: bash
        run: |
          set +e
          node scripts/verify-d4.js
          code=$?
          echo "D4 offline verifier exit: $code (3 means NOT_RUN/BLOCKED, not PASS)"
          if [ "$code" -eq 1 ] || [ "$code" -eq 2 ]; then exit "$code"; fi
          exit 0
      - name: D4 performance failure diagnostic (no metric override)
        if: always()
        shell: bash
        run: |
          echo "Inspecting latest B6 verifier log (no pass/fail override)"
          file=$(find evidence/d4/runs -type f -name '*b6-scale-performance*' 2>/dev/null | sort | tail -n 1)
          if [ -n "$file" ]; then sed -n '1,120p' "$file"; else echo "No B6 log found"; fi
      - name: D4 CLI refactor contract tests
        if: always()
        run: node --test scripts/d4/browser/cli.test.mjs
      - name: D4 B6 browser measurement contract tests
        if: always()
        run: node --test scripts/d4/browser/scale-measurements.test.mjs
      - name: D4 verifier failure-injection selftest
        if: always()
        run: node scripts/verify-d4-selftest.js
      - name: Frozen PDF registry regression
        if: always()
        run: node --test scripts/d4/pdf/content.test.mjs
