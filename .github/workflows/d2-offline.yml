# TreeAI D2 offline acceptance gate (Agent F).
#
# The DEFAULT CI gate: fully offline, zero credentials, zero secrets. It runs
# scripts/verify-d2.js, which enforces the frozen exit-code discipline
# (0 = all PASS, 1 = verifier error, 2 = FAIL, 3 = BLOCKED/NOT_RUN) across
# typecheck, per-module unit tests, integration tests, schema validation,
# secret scanning and residual-resource checks.
#
# The live suite (model calls) is NEVER triggered here — see d2-live.yml
# (workflow_dispatch + protected environment only).
#
# This workflow must not reference any secret: `secrets.*` appears nowhere.

name: d2-offline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: d2-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:d2 (offline, no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node (pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: D2 offline acceptance verifier
        run: node scripts/verify-d2.js

      - name: D2 failure-path selftest
        run: node scripts/verify-d2-selftest.js

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/d2/
          retention-days: 14
