<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TreeAI Studio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <button id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar">☰ Trees</button>
    <aside id="sidebar" aria-label="Trees">
      <h1>TreeAI Studio</h1>
      <p class="subtitle">D3 Core MVP · trusted-local</p>
      <button id="new-tree" class="primary">＋ New Tree</button>
      <ul id="tree-list" aria-label="Trees"></ul>
      <!-- 列表加载失败态（W2 §2.1）：常驻错误 + 重试（非 8 秒自动隐藏横幅）。 -->
      <div id="list-load-error" hidden>
        <p id="list-load-message"></p>
        <button id="list-retry">Retry</button>
      </div>
      <p id="driver-note" class="muted"></p>
    </aside>
    <main id="main">
      <div id="empty-state" hidden>
        <p>No Tree open.</p>
        <p class="muted">Create a Tree to start a Trunk conversation.</p>
      </div>
      <section id="tree-view" hidden>
        <header id="branch-bar">
          <nav id="branch-tabs" aria-label="Branches"></nav>
          <span id="cursor-note" class="muted"></span>
          <button id="source-drawer-toggle" class="drawer-toggle" aria-expanded="false">⑂ Sources</button>
        </header>
        <div id="diagnostics-bar">
          <span id="run-status" class="run-status idle" aria-live="polite">idle</span>
          <span id="run-detail" class="muted"></span>
          <button id="abort-run" class="danger" hidden>Abort run</button>
          <span id="policy-note" class="muted"></span>
        </div>
        <div id="failure-panel" hidden></div>
        <div id="session-banner" hidden></div>
        <div id="reading-area">
          <div id="main-pane">
            <div id="conversation" aria-live="polite" aria-label="Trunk conversation"></div>
            <!-- 错误横幅朗读语义（W2 §2.4）：role=alert（隐式 aria-live）+ 可 Tab 触达。 -->
            <div id="error-banner" role="alert" tabindex="0" hidden></div>
            <div id="composer">
              <textarea id="prompt-input" rows="3" aria-label="Ask on the Trunk" placeholder="Ask on the Trunk…"></textarea>
              <div class="composer-actions">
                <button id="send" class="primary">Send</button>
              </div>
            </div>
          </div>
          <!-- 支线局部面板（W2 §2.3）：锚点作用域；固定“来源/回程”操作；
               覆盖层形态——主线阅读位置在开合与转场期间不动。 -->
          <aside id="branch-panel" hidden aria-label="Branch side panel">
            <header id="panel-header">
              <div id="panel-heading">
                <p id="panel-title"></p>
                <!-- 揭示降级焦点的说明区（W2 §2.6）：摘录 + 状态徽标，常驻可读，可程序聚焦。 -->
                <p id="panel-anchor-context" tabindex="-1"></p>
              </div>
              <div id="panel-fixed-actions">
                <button id="panel-view-source" class="source-button">⌖ View source</button>
                <button id="panel-close" class="panel-close">↩ Back to Trunk</button>
              </div>
              <div id="panel-session-note" hidden tabindex="-1"></div>
            </header>
            <div id="panel-conversation" aria-live="polite" aria-label="Branch conversation"></div>
            <div id="panel-error-banner" role="alert" tabindex="0" hidden></div>
            <div id="panel-composer">
              <textarea id="panel-prompt-input" rows="3" aria-label="Continue this branch" placeholder="Continue this branch…"></textarea>
              <div class="composer-actions">
                <button id="panel-send" class="primary">Send</button>
              </div>
            </div>
            <div id="return-panel">
              <h2>Return to Trunk</h2>
              <p class="muted">Edit the branch result, then explicitly submit it to the Trunk.</p>
              <textarea id="return-input" rows="4" aria-label="Return draft"></textarea>
              <div class="composer-actions">
                <button id="submit-return" class="accent">Submit Return to Trunk</button>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>
    <aside id="source-drawer" hidden aria-label="Sources" tabindex="-1"></aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
